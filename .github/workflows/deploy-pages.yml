name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Ask GitHub where the site is served: "/SJK-Website" on the
      # github.io address, or "" once a custom domain (sjkguahan.com) is set
      # in Settings → Pages. The build uses that as its base path, so the
      # same workflow is right for both without editing.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/

      # Single-page app: give every page its own copy of index.html so links
      # like /who-we-are load directly and return 200 (not 404) to visitors
      # and search engines. 404.html covers any other address.
      # Keep this list in step with the routes in src/App.jsx.
      - run: |
          for route in who-we-are brands-partners projects news contact; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
